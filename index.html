<title>Prospect Video Finder</title>
<style>
:root{color-scheme:dark;--bg:#0e1412;--surface:#161e1b;--fg:#e6ece9;--muted:#98a6a0;--line:#27322e;--accent:#4fc4a5;--err:#f0a184}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,sans-serif;padding:16px}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 24px;display:flex;flex-direction:column;gap:14px}
h1{margin:0;font-size:1.3rem}
p{margin:0;color:var(--muted);font-size:.9rem}
input{font:inherit;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;padding:10px;border:0;border-radius:8px;background:var(--accent);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
.err{color:var(--err);min-height:1.4em}
</style></head><body>

</form>
